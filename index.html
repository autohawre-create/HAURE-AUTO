<!DOCTYPE html>
<html dir="rtl" lang="ckb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2933">
<title>HAWRE AUTO</title>
<meta name="description" content="HAWRE-AUTO">
<meta property="og:type" content="website">
<meta property="og:title" content="HAWRE AUTO">
<meta property="og:description" content="هاوردەکردنی سەیارە لە ئەمریکا، کەنەدا و ئیماراتەوە بۆ کوردستان.">
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=Noto+Kufi+Arabic:wght@500;700;800&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================ ڕەنگەکان: جەرگی + سپی ============================ */
:root{
  --red:#1f2933;      /* جەرگی سەرەکی */
  --red-d:#1f2933;    /* جەرگی تۆخ */
  --ink:#1f2933;      /* ڕەنگی نووسین */
  --dim:#1f2933;      /* نووسینی لاواز */
  --line:#cbd2d9;     /* هێڵی تەنک */
  --tint:#f9fafb;     /* سپی کەمێک جەرگی */
  --w:1240px;
  --r:28px;           /* خڕی گۆشەکان */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;color:var(--ink);background:#fff;line-height:1.7}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:var(--w);margin:0 auto;padding:0 24px}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ============================ دوگمەکان ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 28px;border-radius:40px;border:1.5px solid var(--red);background:var(--red);color:#fff;font-weight:700;font-size:.95rem;transition:.2s}
.btn:hover{background:#fff;color:var(--red)}
.btn.out{background:#fff;color:var(--red)}
.btn.out:hover{background:var(--red);color:#fff}
.btn.wh{background:#fff;color:var(--red);border-color:#fff}
.btn.wh:hover{background:transparent;color:#fff}

/* ============================ شوێنی وێنە و ڤیدیۆ ============================ */
.slot{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(135deg,#eceff3,#dfe3e8)}
.slot>img,.slot>video,.slot>iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;z-index:1}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;color:#9aa5b1;padding:10px}
.ph svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ph b{font-size:.72rem;font-weight:700;direction:ltr;word-break:break-all}
.ph small{font-size:.68rem;opacity:.8;direction:ltr}

/* ============================ بارەکەی سەرەوە + هێدەر ============================ */
.util{background:#fff;border-bottom:1px solid var(--line);font-size:.76rem;color:var(--dim)}
.util .wrap{display:flex;justify-content:space-between;align-items:center;height:30px}
.util nav{display:flex;gap:22px}
.util a:hover{color:var(--red)}

header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;height:64px;gap:28px}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.3rem;color:var(--red);flex:none}
/* لۆگۆی درێژ: پانی و بەرزی لێرە بگۆڕە */
.logo{gap:14px}
.logo-img{height:54px;width:auto;max-width:200px;object-fit:contain;display:block;border-radius:10px}
/* نووسینی HAWRE AUTO لە تەنیشت لۆگۆ */
.logo-txt{font-family:'Outfit','Poppins','Segoe UI',sans-serif;font-weight:400;font-size:1.35rem;letter-spacing:.18em;line-height:1;white-space:nowrap;padding-inline-start:14px;border-inline-start:1.5px solid currentColor;border-color:rgba(18,24,31,.28)}
.logo-txt b{font-weight:700}
footer .logo-txt{border-color:rgba(255,255,255,.3)}
footer .logo-img{background:#fff;padding:3px}
.menu{display:flex;gap:26px;flex:1;font-weight:500;font-size:.95rem}
.menu a{padding:22px 0;border-bottom:2px solid transparent}
.menu a:hover{border-color:var(--red);color:var(--red)}
.menu .m-cta{display:none}
.lang{display:flex;background:var(--tint);border:1px solid var(--line);border-radius:30px;padding:3px}
.lang button{border:0;background:none;border-radius:30px;padding:5px 13px;font-size:.82rem;font-weight:700;color:var(--dim);min-height:30px}
.lang button.on{background:var(--red);color:#fff}
.tools .btn{min-height:40px;padding:0 22px;font-size:.88rem}
.burger{display:none;width:44px;height:44px;border:0;background:var(--tint);border-radius:50%;font-size:1.4rem;color:var(--red)}

/* ============================ وێنەی سەرەکی (هەموو وێنەکە دیارە، بێ بڕین) ============================ */
.hero{background:#fff}
.hero .slot{height:auto;aspect-ratio:1600/699;max-height:calc(100svh - 94px);border-radius:0 0 var(--r) var(--r);background:linear-gradient(135deg,var(--red),var(--red-d))}
.hero .slot>img.hbg{inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);filter:blur(28px) brightness(.6);z-index:0}
.hero .slot>img:not(.hbg),.hero .slot>video,.hero .slot>iframe{object-fit:contain}
.hero .ph{color:#e4e7eb}
.hero .txt{display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 24px 64px}
.eyebrow{display:inline-block;background:var(--tint);border:1px solid var(--line);color:var(--red);font-size:.84rem;font-weight:700;padding:6px 18px;border-radius:40px}
.hero h1{margin-top:18px;font-size:clamp(1.9rem,4vw,3.3rem);font-weight:800;line-height:1.35;max-width:22ch;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{margin-top:14px;max-width:60ch;color:var(--dim);font-size:1.05rem}
.acts{display:flex;justify-content:center;gap:12px;margin-top:28px;flex-wrap:wrap}
.acts .btn{min-height:50px;padding:0 34px}

/* ============================ ژمارەکان ============================ */
.strip{border-block:1px solid var(--line)}
.strip .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.strip div{padding:28px 10px;text-align:center;border-inline-start:1px solid var(--line)}
.strip div:first-child{border:0}
.strip b{display:block;font-size:2rem;font-weight:800;color:var(--red);line-height:1.3}
.strip span{font-size:.86rem;color:var(--dim)}

/* ============================ بەشەکان ============================ */
section{padding:84px 0}
.h2{text-align:center;font-size:clamp(1.7rem,3vw,2.5rem);font-weight:800;line-height:1.3}
.sub{text-align:center;color:var(--dim);margin:8px auto 0;max-width:60ch}

/* سەیارەکان */
.cats{display:flex;justify-content:center;gap:10px;margin-top:30px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:40px;padding:0 22px;min-height:44px;font-weight:700;color:var(--ink);transition:.2s}
.cat.on{background:var(--red);border-color:var(--red);color:#fff}
.filters{display:flex;justify-content:center;gap:12px;margin:22px 0 30px;flex-wrap:wrap}
.filters input,.filters select{min-height:46px;padding:0 20px;border:1.5px solid var(--line);border-radius:40px;background:#fff;min-width:170px;font-size:16px}
.filters input{flex:1;max-width:360px;min-width:220px}
.filters input:focus,.filters select:focus{outline:0;border-color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{background:var(--tint);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 40px -14px rgba(18,24,31,.35)}
.card .im{aspect-ratio:16/10;position:relative}
.card .im .slot>img{transition:transform .6s}
.card:hover .im .slot>img{transform:scale(1.06)}
.tag{position:absolute;top:12px;inset-inline-start:12px;z-index:3;background:var(--red);color:#fff;font-size:.74rem;font-weight:700;padding:3px 14px;border-radius:30px}
.fav{position:absolute;top:10px;inset-inline-end:10px;z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:#fff;font-size:1.2rem;color:var(--red);box-shadow:0 2px 8px rgba(18,24,31,.18)}
.card .bd{padding:20px 22px 22px;display:flex;flex-direction:column;gap:4px;flex:1}
.yr{font-size:.82rem;color:var(--dim)}
.card h3{font-size:1.2rem;font-weight:800}
.sp{font-size:.88rem;color:var(--dim)}
.pr{margin-top:12px;font-size:.8rem;color:var(--dim)}
.pr b{display:block;font-size:1.45rem;color:var(--red)}
.card .btn{margin-top:16px;width:100%}
.empty{grid-column:1/-1;padding:50px;text-align:center;color:var(--dim);background:var(--tint);border-radius:var(--r)}

/* سەیاری هەفتە */
.feat{padding:0 24px}
.feat .box{max-width:var(--w);margin:0 auto;background:var(--tint);border-radius:36px;overflow:hidden;display:grid;grid-template-columns:1.1fr 1fr}
.feat .im{min-height:440px}
.feat .tx{padding:56px 52px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.feat .tag{position:static}
.feat .h2,.feat .sub{text-align:start;margin-inline:0}
.specs{display:flex;gap:34px;margin:24px 0 26px;flex-wrap:wrap}
.specs small{display:block;color:var(--dim);font-size:.8rem}
.specs b{font-size:1.15rem}
.price{font-size:2.1rem;font-weight:800;color:var(--red)}
.feat .note{color:var(--dim);font-size:.85rem;margin-bottom:22px}

/* پرۆسەی هێنان */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:40px}
.step{background:var(--tint);border-radius:var(--r);padding:28px 26px 30px;display:flex;flex-direction:column}
.step small{font-size:.74rem;font-weight:700;letter-spacing:.04em;color:var(--red)}
.step h3{font-size:1.25rem;margin:4px 0 8px}
.step p{font-size:.92rem;color:var(--dim)}
/* وێنەکانی پرۆسەی هێنان */
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:36px}
.pics .slot{height:auto;aspect-ratio:4/3;border-radius:var(--r)}
.pics .slot>img{transition:transform .6s}
.pics .slot:hover>img{transform:scale(1.05)}
.step .n{margin-top:20px;width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;order:5}

/* ڤیدیۆکان */
.vids{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:36px}
.vid .slot{height:auto;aspect-ratio:16/9;border-radius:20px}
.vid h3{font-size:1rem;margin-top:12px}

/* بۆچی ئێمە */
.why{background:var(--red);color:#fff;margin:0 24px;border-radius:36px}
.why .sub{color:#cbd2d9}
.tr{display:grid;grid-template-columns:repeat(4,1fr);gap:34px;margin-top:44px}
.tr svg{width:44px;height:44px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tr h3{margin:16px 0 8px;font-size:1.1rem}
.tr p{font-size:.92rem;color:#cbd2d9}

/* داواکردن */
.cta{padding:24px 24px 84px}
.cta .box{max-width:var(--w);margin:0 auto;background:var(--tint);border-radius:36px;padding:52px 56px;display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}
.cta h2{font-size:clamp(1.5rem,2.6vw,2.1rem);font-weight:800}
.cta p{color:var(--dim);margin-top:6px}

/* فووتەر + نەخشە */
footer,.loc{background:var(--red-d);color:#cbd2d9}
footer{padding:56px 0 24px;font-size:.92rem;border-radius:36px 36px 0 0}
.fg{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:34px}
footer h4{color:#fff;margin-bottom:12px}
footer a{display:block;padding:4px 0}
footer a:hover{color:#fff}
footer .logo{padding:0;color:#fff}
.fb{margin-top:36px;padding-top:20px;border-top:1px solid rgba(255,255,255,.15);font-size:.82rem}
.loc{padding:8px 0 56px}
.loc h2{color:#fff;font-size:1.5rem;font-weight:800}
.loc p{margin-bottom:18px}
.loc .map{border-radius:var(--r);overflow:hidden;height:380px;background:#12181f}
.loc iframe{width:100%;height:100%;border:0;display:block}
.loc .btn{margin-top:18px;background:#fff;color:var(--red);border-color:#fff}
.loc .btn:hover{background:transparent;color:#fff}

/* سۆشیاڵ میدیا (خوارترین بەشی لاپەڕە) */
.social{background:var(--red-d);color:#cbd2d9;text-align:center;padding:34px 0 calc(34px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.12)}
.social p{font-weight:700;color:#fff;font-size:1rem;margin-bottom:16px}
.soc-row{display:flex;justify-content:center;gap:14px}
.soc-a{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.35);color:#fff;transition:.25s}
.soc-a svg{width:24px;height:24px}
.soc-a:hover{background:#fff;color:var(--red);transform:translateY(-4px);box-shadow:0 10px 22px -8px rgba(18,24,31,.5)}
.soc-c{display:block;margin-top:22px;font-size:.78rem;letter-spacing:.2em;opacity:.6;font-family:'Outfit',sans-serif}

/* دوگمەی واتسئاپ */
.wa{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));inset-inline-start:20px;z-index:60;width:56px;height:56px;border-radius:50%;background:#1faa59;color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(18,24,31,.3)}
.wa svg{width:30px;height:30px}

/* پەنجەرەی وردەکاری */
.modal{position:fixed;inset:0;background:rgba(18,24,31,.65);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.modal.show{display:flex}
.mbox{background:#fff;max-width:880px;width:100%;max-height:92svh;overflow:auto;position:relative;border-radius:var(--r)}
.mx{position:absolute;top:12px;inset-inline-start:12px;z-index:5;width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:1.6rem;color:var(--red);box-shadow:0 2px 8px rgba(18,24,31,.25)}
.gal{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:6px;height:340px;padding:8px}
.gal>div:first-child{grid-row:span 2}
.gal .slot,.mvid .slot{border-radius:18px}
.mvid{height:280px;padding:0 8px}
.mc{padding:24px 28px 30px}
.mc h2{font-size:1.7rem}
.mc .sub{text-align:start;margin:4px 0 0}
.ms{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0 26px}
.ms div{background:var(--tint);border-radius:16px;padding:12px 14px}
.ms small{display:block;color:var(--dim);font-size:.78rem}


/* ڕیزکردنی نووسینی ئینگلیزی لە ناو ماڵپەڕی ڕاستەوچەپ */
html[dir=rtl] .card .bd>*,html[dir=rtl] .mc h2{text-align:right}
/* ============================ تابلێت ============================ */
@media(max-width:980px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .vids{grid-template-columns:1fr}
  .steps,.tr{grid-template-columns:repeat(2,1fr)}
  .feat .box{grid-template-columns:1fr}
  .feat .im{min-height:280px}
  .fg{grid-template-columns:1fr 1fr}
}

/* ============================ مۆبایل ============================ */
@media(max-width:760px){
  .wrap{padding:0 16px}
  section{padding:56px 0}
  .util{display:none}
  .bar{height:60px;gap:10px}
  .logo{gap:9px}
  .logo-img{height:42px;max-width:110px}
  .logo-txt{font-size:.95rem;letter-spacing:.1em;padding-inline-start:9px}
  .tools{display:none}
  .burger{display:block}
  .lang{margin-inline-start:auto}
  .lang button{padding:5px 10px}
  .menu{display:none;position:fixed;top:60px;inset-inline:0;bottom:0;background:#fff;flex-direction:column;gap:0;padding:8px 20px 30px;overflow:auto;z-index:49}
  .menu.open{display:flex}
  .menu a{padding:0;min-height:58px;display:flex;align-items:center;font-size:1.1rem;font-weight:700;border-bottom:1px solid var(--line)}
  .menu .m-cta{display:flex;justify-content:center;margin-top:22px;border:1.5px solid var(--red);background:var(--red);color:#fff;border-radius:40px;min-height:54px}
  .hero .slot{max-height:none;border-radius:0 0 22px 22px}
  .hero .txt{padding:28px 16px 44px}
  .acts{width:100%}
  .acts .btn{flex:1 1 100%}
  .strip .wrap{grid-template-columns:repeat(2,1fr)}
  .strip div:nth-child(3){border-inline-start:0}
  .strip div:nth-child(n+3){border-top:1px solid var(--line)}
  .strip div{padding:20px 8px}
  .strip b{font-size:1.6rem}
  .filters{flex-direction:column;align-items:stretch;margin:16px 0 24px}
  .filters input,.filters select,.filters .btn{width:100%;max-width:none}
  .cats{justify-content:flex-start;margin-inline:-16px;padding-inline:16px}
  .grid{grid-template-columns:1fr;gap:18px}
  .feat{padding:0 12px}
  .feat .box{border-radius:28px}
  .feat .tx{padding:30px 22px 34px}
  .feat .im{min-height:230px}
  .feat .btn{width:100%}
  .steps,.tr{grid-template-columns:1fr;gap:16px}
  .pics{grid-template-columns:1fr;gap:14px;margin-top:28px}
  .why{margin:0 12px;border-radius:28px}
  .cta{padding:16px 12px 56px}
  .cta .box{border-radius:28px;padding:32px 22px}
  .cta .btn{width:100%}
  .fg{grid-template-columns:1fr;gap:26px}
  footer{border-radius:28px 28px 0 0}
  .loc .map{height:300px}
  .loc .btn{width:100%}
  /* پەنجەرەی وردەکاری وەک لاپەڕەی خوارەوە */
  .modal{padding:0;align-items:flex-end}
  .mbox{max-height:94svh;border-radius:26px 26px 0 0}
  .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:auto;padding:8px;gap:8px;scrollbar-width:none}
  .gal::-webkit-scrollbar{display:none}
  .gal>div{flex:0 0 86%;aspect-ratio:16/10;scroll-snap-align:center}
  .mvid{height:210px}
  .mc{padding:20px 18px 26px}
  .mc .btn{width:100%}
  .ms{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.steps.c3{grid-template-columns:repeat(3,1fr)}
@media(max-width:760px){.steps.c3{grid-template-columns:1fr}}

/* ===== وڵاتەکان ===== */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:40px}
.cc{position:relative;overflow:hidden;background:var(--tint);border-radius:var(--r);padding:34px 30px 32px;display:flex;flex-direction:column;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s,background .45s,opacity .7s}
.cc .no{position:absolute;top:6px;inset-inline-end:20px;font:600 6rem/1 'Outfit',sans-serif;color:var(--red);opacity:.09;transition:opacity .45s,transform .45s}
.cc .fl{font-size:3.6rem;line-height:1;width:max-content;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.cc h3{font-size:1.7rem;font-weight:800;margin-top:18px;line-height:1.3}
.cc h4{font-size:.95rem;font-weight:700;opacity:.75;margin-top:2px}
.cc p{margin-top:10px;font-size:.93rem;color:var(--dim)}
.cc:hover{transform:translateY(-8px);box-shadow:0 22px 44px -16px rgba(18,24,31,.4);background:#fff}
.cc:hover .fl{transform:scale(1.12) rotate(-4deg)}
.cc:hover .no{opacity:.18;transform:scale(1.08)}
/* ===== پرۆسە: هێڵی بەستەر ===== */
.steps.path .step{align-items:center;text-align:center}
.steps.path .n{order:-1;margin:0 0 14px;width:44px;height:44px;font-size:1.1rem}
@media(min-width:981px){
 .steps.path .step{position:relative}
 .steps.path .step::before,.steps.path .step::after{content:'';position:absolute;top:50px;height:2px;background:var(--red);opacity:.55}
 .steps.path .step::after{inset-inline-start:calc(50% + 22px);width:calc(50% - 22px + 22px)}
 .steps.path .step::before{inset-inline-end:calc(50% + 22px);width:calc(50% - 22px)}

/* ============ فەرمانەکانی ماڵپەڕ (دەست لێ مەدە) ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lang='ckb';
try{lang=localStorage.getItem('hawre-lang')||'ckb'}catch(e){}
if(!I18N[lang])lang='ckb';
const t=k=>I18N[lang][k]??I18N.ckb[k]??k;

const ICON={
  img:'<svg viewBox="0 0 48 48"><rect x="6" y="9" width="36" height="30" rx="3"/><circle cx="17" cy="20" r="3.5"/><path d="m6 34 11-10 8 7 6-5 11 9"/></svg>',
  vid:'<svg viewBox="0 0 48 48"><rect x="6" y="9" width="36" height="30" rx="3"/><path d="m20 18 11 6-11 6z"/></svg>'
};
const ytId=u=>{const m=String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);return m?m[1]:null};
const player=(src,poster,bg)=>{
  const id=ytId(src);
  if(id)return `<iframe src="https://www.youtube.com/embed/${id}${bg?`?autoplay=1&mute=1&loop=1&controls=0&playlist=${id}`:''}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy" title="video"></iframe>`;
  const p=poster?` poster="${esc(poster)}"`:'';
  return bg?`<video src="${esc(src)}"${p} autoplay muted loop playsinline onerror="this.remove()"></video>`
           :`<video src="${esc(src)}"${p} controls playsinline preload="metadata" onerror="this.remove()"></video>`;
};
/* m={image,video,poster} · key=ناوی ئەم شوێنە لە MEDIA · size=قەبارەی باش */
const slot=(m,key,size,o={})=>{
  m=m||{};let top='';
  if(m.video)top=player(m.video,m.poster||m.image,o.bg);
  else if(m.image)top=`<img src="${esc(m.image)}" alt="HAWRE AUTO" decoding="async" ${o.eager?'fetchpriority="high"':'loading="lazy"'} onerror="this.remove()">`;
  return `<div class="slot"><div class="ph">${ICON[o.kind||'img']}<b>${esc(key)}</b>${size?`<small>${size}</small>`:''}</div>${top}</div>`;
};
const logoHtml=()=>(MEDIA.logo?`<img src="${esc(MEDIA.logo)}" alt="" class="logo-img" onerror="this.remove()">`:'')+'<span class="logo-txt ltr"><b>HAWRE</b> AUTO</span>';

/* ---- دانانی میدیا ---- */
$('site-logo').innerHTML=logoHtml();
$('footer-logo').innerHTML=logoHtml();
if(MEDIA.favicon)$('favicon').href=MEDIA.favicon;
$('hero-media').outerHTML=slot(MEDIA.hero,'MEDIA.hero.image','1920×840',{bg:true,eager:true});
$('pics').innerHTML=[0,1,2].map(i=>`<div>${slot({image:(MEDIA.process||[])[i]},'MEDIA.process['+i+']','1200×900')}</div>`).join('');
(()=>{ /* وێنەی سەرەکی: ڕێژەی وێنەکە وەردەگرێت + لایەکانی بە لێڵی پڕ دەکاتەوە */
  const s=document.querySelector('.hero .slot'),i=s.querySelector('img');
  if(i){const c=i.cloneNode();c.className='hbg';c.setAttribute('aria-hidden','true');c.onerror=()=>c.remove();i.before(c);
    const fit=()=>{if(i.naturalWidth)s.style.aspectRatio=i.naturalWidth+'/'+i.naturalHeight};
    i.complete?fit():i.addEventListener('load',fit)}
})();

/* ---- زمان ---- */
function setLang(l){
  lang=l;try{localStorage.setItem('hawre-lang',l)}catch(e){}
  const h=document.documentElement;h.lang=l;h.dir=l==='en'?'ltr':'rtl';
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));

const AR='٠١٢٣٤٥٦٧٨٩';
function runCount(el){

  const txt=t(el.dataset.i),m=txt.match(/[0-9٠-٩]+/);if(!m)return;

}
