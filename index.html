<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d0b17">
<title>HAWRE AUTO</title>
<meta name="description" content="HAWRE-AUTO">
<meta property="og:type" content="website">
<meta property="og:title" content="HAWRE AUTO">
<meta property="og:description" content="هاوردەکردنی سەیارە لە ئەمریکا، کەنەدا و ئیماراتەوە بۆ کوردستان.">
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=Noto+Kufi+Arabic:wght@700;800&family=Cairo:wght@600;700;800&family=Outfit:wght@600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
:root{--w:1040px;--ink:#1a0a0e;--wine:#7a1530;--wine2:#6e1428}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:46px;font-size:13px;-webkit-text-size-adjust:100%;text-size-adjust:100%;
 background:radial-gradient(900px 520px at 85% 0,rgba(255,140,165,.30),transparent 60%),radial-gradient(800px 560px at 5% 38%,rgba(255,120,150,.17),transparent 62%),radial-gradient(800px 560px at 95% 70%,rgba(255,120,150,.15),transparent 62%),linear-gradient(180deg,#7d1832,#4a1022 32%,#2a0813 68%,#1d0409) #1d0409}
body{font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;color:#fff;line-height:1.7;font-size:1.02rem;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-wrap:break-word}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(38% 40% at 78% 25%,rgba(255,130,160,.16),transparent 70%),radial-gradient(34% 38% at 18% 75%,rgba(255,255,255,.06),transparent 70%)}
.gnet{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
::selection{background:var(--wine);color:#fff}
h1,h2,h3,.btn,.menu a{font-family:'Noto Kufi Arabic','Vazirmatn',sans-serif;letter-spacing:0}
html[lang=en] h1,html[lang=en] h2,html[lang=en] h3,html[lang=en] .btn,html[lang=en] .menu a{font-family:'Outfit','Vazirmatn',sans-serif;font-weight:600}
img,svg,video,iframe{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.ltr{direction:ltr;unicode-bidi:isolate}
.wrap{max-width:var(--w);margin:0 auto;padding:0 14px}

/* ---------- دەرکەوتن لە سڕۆڵ ---------- */
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}

/* ---------- دوگمە ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border:0;border-radius:999px;background:linear-gradient(135deg,#8f1b3b,#4a0d1b);color:#fff;font-size:.78rem;font-weight:700;cursor:pointer;box-shadow:0 10px 22px -12px rgba(74,13,27,.7);transition:transform .25s,box-shadow .25s,background .25s}
.btn:hover{background:linear-gradient(135deg,#ac2549,#6e1428);transform:translateY(-2px);box-shadow:0 14px 26px -12px rgba(74,13,27,.75)}

/* ---------- هێدەر ---------- */
header{position:fixed;top:0;inset-inline:0;z-index:50;background:rgba(42,8,19,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.1);transition:box-shadow .3s,border-color .3s}
header.sc{box-shadow:0 12px 32px -22px rgba(18,24,31,.5)}
.bar{display:flex;align-items:center;gap:6px;height:46px}
.logo{display:flex;align-items:center;gap:12px;flex:none;color:#fff}
.logo-img{height:26px;width:auto;max-width:64px;object-fit:contain;border-radius:6px}
.logo-txt{font:600 .78rem/1 'Outfit',sans-serif;letter-spacing:.08em;white-space:nowrap}
.logo-txt b{font-weight:700}
.logo-img+.logo-txt{padding-inline-start:8px;border-inline-start:1.5px solid rgba(255,255,255,.3)}
.menu{display:none;position:fixed;top:46px;inset-inline:0;bottom:0;flex-direction:column;gap:26px;padding:10px 22px 32px;background:#2a0813;overflow:auto;z-index:49}
.menu.open{display:flex}
.menu a{display:flex;align-items:center;min-height:52px;padding:20px 0;font-size:.9rem;font-weight:700;color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}
.menu .m-cta{justify-content:center;margin-top:26px;min-height:54px;border:0;border-radius:999px;background:#fff;color:var(--wine2)}
.lang{display:flex;margin-inline-start:auto;padding:3px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:999px}
.lang button{border:0;background:none;border-radius:999px;padding:2px 7px;min-height:22px;font-size:.68rem;font-weight:700;color:#fff;cursor:pointer;transition:.25s}
.lang button.on{background:#fff;color:var(--wine2)}
.tools{display:none}
.burger{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:transparent;font-size:.9rem;color:#fff;cursor:pointer}
@media(max-width:340px){.logo-txt{display:none}}

/* ---------- وێنەی گشتی ---------- */
.slot{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(135deg,#eceff3,#dfe3e8)}
.slot>img,.slot>video,.slot>iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.slot>img.hbg{filter:blur(26px) brightness(.85);transform:scale(1.15)}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;color:#9aa5b1;padding:10px}
.ph svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ph b{font-size:.78rem}
.ph small{opacity:.7;font-size:.72rem}

/* ---------- سەرەوە ---------- */
.hero{position:relative;padding-top:46px}
.hero .slot{aspect-ratio:1920/700;height:auto}
.hero .slot>img:not(.hbg),.hero .slot>video{object-fit:contain}
.hero .txt{position:relative;z-index:3;padding:12px 14px;text-align:center;overflow-wrap:anywhere}
.hero .txt>*{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.hero h1{font-size:.9rem;line-height:1.5;font-weight:800;text-wrap:balance;animation-delay:.15s}
.hero h1 em{font-style:normal;border-bottom:2px solid #fff}
.hero p{display:none;animation-delay:.35s}

/* ---------- بەشەکان ---------- */
section{padding:24px 0}
#countries,#process,.cta,footer{position:relative;overflow:hidden;color:#fff}
#countries{padding-bottom:28px}
#process{padding-top:28px}
.h2{font-size:1rem;font-weight:800;line-height:1.5;text-align:center;text-wrap:balance;letter-spacing:-.01em}
.h2::before{content:'';display:block;width:26px;height:3px;margin:0 auto 8px;border-radius:2px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.4)}
.sub{max-width:56ch;margin:6px auto 0;text-align:center;color:rgba(255,255,255,.82);font-size:.78rem;line-height:1.7;text-wrap:pretty}

/* وڵاتەکان */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:720px;margin:14px auto 0}
.cc{position:relative;display:flex;flex-direction:column;align-items:center;padding:10px 2px 8px;border-radius:12px;overflow:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .7s}
.cc:hover{transform:translateY(-6px)}
.cc .fl{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 26px -4px rgba(255,255,255,.4)}
.cc .fl svg{width:100%;height:100%;border-radius:50%}
.cc h3{margin-top:7px;font-size:.72rem;font-weight:700}

/* پرۆسە */
.steps{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px}
.steps::before{content:'';position:absolute;top:12px;inset-inline:12.5%;height:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.7) 0 10px,transparent 10px 18px)}
.step{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 2px;text-align:center;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.step:hover{transform:translateY(-4px)}
.step p{display:none;margin-top:4px;font-size:.8rem;line-height:1.7;color:rgba(255,255,255,.8)}
.step .n{order:-1;position:relative;z-index:1;display:grid;place-items:center;width:25px;height:25px;margin-bottom:6px;border:2px solid #431020;border-radius:50%;background:#fff;color:var(--wine2);font:600 .8rem/1 'Outfit',sans-serif;box-shadow:0 0 0 2px rgba(255,255,255,.8),0 12px 24px -10px rgba(0,0,0,.6)}
.step h3{font-size:.64rem;font-weight:800;line-height:1.5}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:14px}
.pics .slot{aspect-ratio:1/1;height:auto;border-radius:10px;background:none}
.pics .slot>img{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.pics .slot:hover>img{transform:scale(1.05)}
.pics .ph{color:rgba(255,255,255,.55)}

/* فۆڕم */
.cta{padding:22px 10px}
.rq{max-width:var(--w);margin:0 auto;display:grid;grid-template-columns:1fr;overflow:hidden;border-radius:14px}
.rq>div{display:flex;flex-direction:column;justify-content:center;padding:16px 14px;color:#f3dfe4}
.rq>div::before{content:'';display:block;width:44px;height:3px;margin-bottom:10px;border-radius:2px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.4)}
.rq h2{color:#fff;font-size:.98rem;line-height:1.5;font-weight:800}
.rq p{margin-top:6px;font-size:.78rem;color:rgba(255,255,255,.82)}
.rq form{display:grid;grid-template-columns:1fr;gap:8px;padding:14px 12px}
.rq input,.rq select{width:100%;min-height:40px;padding:0 12px;border:1.5px solid transparent;border-radius:11px;background:#fff;color:var(--ink);font-size:16px;transition:border-color .2s,box-shadow .2s}
.rq input:focus,.rq select:focus{outline:0;border-color:var(--wine);box-shadow:0 0 0 4px rgba(122,21,48,.13)}
.rq .full{min-height:42px}

/* ---------- فووتەر ---------- */
footer{padding:22px 0 14px}
footer::before{content:'';position:absolute;inset-inline:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px}
.fg>div{min-width:0}
.fg>div:first-child,.fg .fm{grid-column:1/-1}
.about{margin-top:14px;max-width:34ch}
footer h4{color:#fff;font-size:.85rem;margin-bottom:6px}
footer a,.adr{display:block;padding:2px 0;font-size:.78rem;line-height:1.7}
footer a:hover{color:#f0d6dc}
html[dir=rtl] footer a[href^="tel"],html[dir=rtl] footer a[href^="mailto"]{text-align:right}
.fmap{height:150px;border-radius:14px;overflow:hidden}
.fmap a{display:block;width:100%;height:100%}
.fmap img{width:100%;height:100%;object-fit:cover;object-position:30% 22%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.fmap:hover img{transform:scale(1.05)}
.fmap iframe{width:100%;height:100%;border:0;filter:grayscale(1) contrast(1.05);transition:filter .5s}
.fmap:hover iframe{filter:none}
#map-link{display:inline-block;margin-top:10px;color:#fff;font-weight:700;font-size:.9rem;border-bottom:1px solid #fff}
.fb{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:.75rem}
.soc-row{display:flex;gap:14px}
.soc-a{position:relative;display:grid;place-items:center;width:36px;height:36px;padding:0;border-radius:50%;color:#fff;box-shadow:0 0 0 1.5px rgba(255,255,255,.18),0 10px 22px -8px rgba(0,0,0,.7);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.soc-a:hover{transform:translateY(-5px) scale(1.08);color:#fff}
.soc-a:active{transform:scale(.95)}
.soc-a svg{width:20px;height:20px}
.soc-a[aria-label=instagram]{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%)}
.soc-a[aria-label=instagram]:hover{box-shadow:0 0 0 1.5px rgba(255,255,255,.5),0 14px 26px -8px rgba(214,36,159,.75)}
.soc-a[aria-label=facebook]{background:#0866FF;overflow:hidden}
.soc-a[aria-label=facebook] svg{width:100%;height:100%;border-radius:50%}
.soc-a[aria-label=facebook]:hover{box-shadow:0 0 0 1.5px rgba(255,255,255,.5),0 14px 26px -8px rgba(8,102,255,.8)}
.soc-a[aria-label=tiktok]{background:linear-gradient(145deg,#1a1a1a,#000)}
.soc-a[aria-label=tiktok] svg{width:22px;height:22px}
.soc-a[aria-label=tiktok]:hover{box-shadow:0 0 0 1.5px rgba(255,255,255,.5),-6px 8px 22px -8px rgba(37,244,238,.7),6px 8px 22px -8px rgba(254,44,85,.7)}
.soc-a[aria-label=whatsapp]{background:#1faa59}
.soc-a[aria-label=whatsapp]:hover{box-shadow:0 0 0 1.5px rgba(255,255,255,.5),0 14px 26px -8px rgba(31,170,89,.8)}
.soc-a[aria-label=whatsapp] svg{width:25px;height:25px}

/* ---------- تابلێت و کۆمپیوتەر ---------- */
@media(min-width:761px){
 html{scroll-padding-top:56px}
 .wrap{padding:0 20px}
 .btn{min-height:38px;padding:0 20px;font-size:.88rem}
 .bar{height:56px;gap:18px}
 .logo-img{height:32px;max-width:120px;border-radius:8px}
 .logo-txt{font-size:1rem;letter-spacing:.12em}
 .logo-img+.logo-txt{padding-inline-start:12px}
 .menu{top:56px}
 .menu a{min-height:62px}
 .lang button{padding:3px 10px;min-height:26px;font-size:.78rem}
 .burger{width:44px;height:44px;border-radius:12px;font-size:1.3rem}
 /* سەرەوە */
 .hero{padding-top:56px}
 .hero .slot{aspect-ratio:var(--ar,1920/840);max-height:calc(100svh - 56px)}
 .hero .txt{display:flex;flex-direction:column;align-items:center;padding:28px 24px 8px}
 .hero h1{max-width:22ch;margin:0 auto;font-size:clamp(1.5rem,2.6vw,2.3rem);line-height:1.4;text-shadow:0 4px 40px rgba(0,0,0,.5)}
 .hero h1::before{content:'';display:block;width:40px;height:3px;margin:0 auto 14px;border-radius:2px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.4)}
 .hero h1 em{border:0;text-shadow:0 2px 30px rgba(0,0,0,.6)}
 .hero p{display:block;max-width:42ch;margin:12px auto 0;font-size:.92rem;line-height:2;color:rgba(255,255,255,.92);text-shadow:0 1px 18px rgba(0,0,0,.5)}
 /* بەشەکان */
 section{padding:72px 0}
 #countries{padding-bottom:72px}
 #process{padding-top:72px}
 .h2{font-size:clamp(1.2rem,2vw,1.6rem)}
 .h2::before{width:34px;margin-bottom:10px}
 .sub{max-width:48ch;margin-top:8px;font-size:.88rem;line-height:1.9}
 .cgrid{max-width:480px;gap:10px;margin-top:22px}
 .cc{padding:18px 8px 14px;border-radius:16px}
 .cc .fl{width:50px;height:50px}
 .cc h3{margin-top:10px;font-size:.92rem}
 .steps{gap:10px;margin-top:24px}
 .steps::before{top:20px}
 .step{padding:0 10px}
 .step p{display:block}
 .step .n{width:40px;height:40px;margin-bottom:9px;border-width:4px;font-size:1rem}
 .step h3{font-size:.92rem}
 .pics{grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:290px;margin-top:26px}
 .pics>div{height:100%}
 .pics>div:first-child{grid-row:1/3}
 .pics .slot{aspect-ratio:auto;height:100%;border-radius:14px}
 .cta{padding:72px 24px}
 .rq{grid-template-columns:1fr 1.25fr;max-width:calc(var(--w) - 48px);border-radius:20px}
 .rq>div{padding:26px}
 .rq>div::before{height:4px;margin-bottom:18px}
 .rq h2{font-size:1.3rem}
 .rq p{margin-top:10px;font-size:.85rem}
 .rq form{grid-template-columns:1fr 1fr;gap:9px;padding:26px;align-content:center}
 .rq input,.rq select{padding:0 18px;border-radius:12px;font-size:15px}
 .rq .full{grid-column:1/-1;font-size:1rem}
 footer{padding:34px 0 16px}
 .fg{grid-template-columns:1.3fr 1fr 1fr 1.5fr;gap:22px}
 .fg>div:first-child,.fg .fm{grid-column:auto}
 footer h4{font-size:.95rem}
 footer a,.adr{padding:4px 0;font-size:.9rem;line-height:1.9}
 .fmap{height:190px}
 .fb{flex-direction:row;justify-content:space-between;align-items:center;gap:16px;margin-top:22px;padding-top:22px;font-size:.88rem}
 .soc-a{width:48px;height:48px}
 .soc-a svg{width:24px;height:24px}
}
@media(max-width:760px){.pics .ph b,.pics .ph small{display:none}}
@media(min-width:981px){
 .logo-txt{letter-spacing:.16em}
 .menu{display:flex;position:static;flex-direction:row;justify-content:center;flex:1;padding:0;background:none;overflow:visible}
 .menu a{position:relative;min-height:0;border:0}
 .menu a::after{content:'';position:absolute;inset-inline:0;bottom:14px;height:2px;background:var(--wine);transform:scaleX(0);transition:transform .3s}
 .menu a:hover::after{transform:scaleX(1)}
 .menu .m-cta{display:none}
 .lang{margin-inline-start:0}
 .tools{display:block}
 .tools .btn{min-height:36px;padding:0 18px;font-size:.84rem}
 .burger{display:none}
 header:not(.sc){border-color:transparent}
 header:not(.sc) .lang{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}

 header:not(.sc) .tools .btn{background:#fff;color:var(--wine2);box-shadow:none}
 header:not(.sc) .tools .btn:hover{background:var(--wine);color:#fff}
}

/* ---------- خێراکردن بۆ مۆبایل ---------- */
@media(max-width:760px){
 header{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(42,8,19,.92)}
 .hero .slot>img.hbg{filter:none;transform:none;opacity:.55}
 body::before{display:none}
 .gnet{will-change:transform;transform:translateZ(0)}
 .rv{transition-duration:.45s}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.gnet{animation:none!important}}

/* ===== polish layer ===== */
.h2{background:linear-gradient(180deg,#fff 30%,#ffc9d6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.h2::before{width:46px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 16px rgba(255,170,195,.7)}
.hero h1{filter:drop-shadow(0 6px 30px rgba(0,0,0,.45))}
.hero h1 em{background:linear-gradient(100deg,#fff 0%,#ffb3c6 40%,#fff 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;text-shadow:none;animation:emsh 5s linear infinite}
@keyframes emsh{to{background-position:-220% 0}}
header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,200,215,.55),transparent)}
#pg{position:fixed;top:0;left:0;height:2px;width:0;z-index:60;background:linear-gradient(90deg,#ff9db4,#fff);box-shadow:0 0 10px rgba(255,150,180,.8)}
.btn{position:relative;overflow:hidden;box-shadow:0 12px 28px -14px rgba(255,90,130,.75)}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);transform:translateX(-130%);transition:transform .8s}
.btn:hover::after{transform:translateX(130%)}
.tools .btn{animation:pls 2.8s ease-in-out infinite}
@keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.4)}50%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.cc{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 20px 44px -28px rgba(0,0,0,.75);transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s,border-color .4s}
.cc::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.2) 50%,transparent 60%);transform:translateX(-130%);transition:transform .9s;pointer-events:none}
.cc:hover{border-color:rgba(255,255,255,.45);box-shadow:0 26px 54px -22px rgba(255,110,150,.55)}
.cc:hover::after{transform:translateX(130%)}
.cc .fl{box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 30px -2px rgba(255,150,180,.6)}
.step .n{background:linear-gradient(160deg,#fff,#ffd5df);box-shadow:0 0 0 5px rgba(255,255,255,.12),0 10px 26px -6px rgba(255,110,150,.7);transition:transform .4s}
.step:hover .n{transform:scale(1.12)}

const player=(src,poster)=>{
  const id=ytId(src);
  if(id)return `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&controls=0&playlist=${id}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy" title="video"></iframe>`;

  return `<video src="${esc(src)}"${p} autoplay muted loop playsinline onerror="this.remove()"></video>`;
};
/* m={image,video} · key=ناوی ئەم شوێنە لە MEDIA · size=قەبارەی باش */

  m=m||{};let top='';
  if(m.video)top=player(m.video,m.image);
  else if(m.image)top=`<img src="${esc(m.image)}" alt="HAWRE AUTO" decoding="async" ${eager?'fetchpriority="high"':'loading="lazy"'} onerror="this.remove()">`;
  return `<div class="slot"><div class="ph">${ICON}<b>${esc(key)}</b><small>${size}</small></div>${top}</div>`;
};

  const m=t('wa_msg').replace('{n}',()=>v('n')).replace('{b}',()=>v('b')).replace('{m}',()=>v('m')).replace('{c}',()=>c.options[c.selectedIndex].textContent);

/* ---- دەرکەوتنی نەرم لە سڕۆڵ ---- */
(()=>{if(!('IntersectionObserver' in window))return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;
    el.classList.add('in');io.unobserve(el);
    setTimeout(()=>el.style.transitionDelay='',1500)}),{threshold:.15});
  document.querySelectorAll('.h2,.sub,.cc,.step,.rq').forEach(el=>{
    if(el.matches('.cc,.step'))el.style.transitionDelay=([...el.parentNode.children].indexOf(el)*0.1)+'s';
    el.classList.add('rv');io.observe(el)});
})();

/* ---- تۆڕی خاڵ و هێڵ (سووککراو بۆ مۆبایل — هەمیشە دەجووڵێت) ---- */
(()=>{
 return; /* تۆڕی خاڵەکان ڕاگیراوە (شاراوە بوو و تەنها پڕۆسێسەری دەخوارد) */
 const mobile=matchMedia('(max-width:760px)').matches||/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
 const c=document.createElement('canvas');c.className='gnet';c.setAttribute('aria-hidden','true');
 document.body.insertBefore(c,document.body.firstChild);
 const x=c.getContext('2d',{alpha:true});let W,H,P=[],last=0,run=true;
 const FPS=mobile?30:45,STEP=1000/FPS;
 const size=()=>{const d=mobile?1:Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
  const n=mobile?Math.round(Math.min(34,Math.max(22,W*H/16000))):Math.round(Math.min(100,Math.max(50,W*H/9500)));
  const sp=mobile?.5:.7;
  P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*sp,vy:(Math.random()-.5)*sp,r:Math.random()*1.4+1}))};
 const draw=()=>{x.clearRect(0,0,W,H);
  const L=mobile?Math.min(120,W/3.2):Math.min(210,Math.max(110,W/6)),L2=L*L;
  x.lineWidth=1;
  /* هێڵەکان لە ٣ دەستەدا (کەمتر گۆڕینی ستایل = خێراتر) */
  for(let k=0;k<3;k++){
   const lo=k/3,hi=(k+1)/3;
   x.strokeStyle='rgba(255,190,205,'+(.5*(1-(lo+hi)/2)).toFixed(2)+')';
   x.beginPath();
   for(let i=0;i<P.length;i++){const a=P[i];
    for(let j=i+1;j<P.length;j++){const b=P[j],dx=a.x-b.x;if(dx>L||dx<-L)continue;
     const dy=a.y-b.y,d2=dx*dx+dy*dy;if(d2>=L2)continue;
     const f=d2/L2;if(f<lo*lo||f>=hi*hi)continue;
     x.moveTo(a.x,a.y);x.lineTo(b.x,b.y)}}
   x.stroke()}
  x.fillStyle='rgba(255,230,236,.95)';x.beginPath();
  for(const p of P){x.moveTo(p.x+p.r,p.y);x.arc(p.x,p.y,p.r,0,6.283)}
  x.fill();
  if(!mobile){x.fillStyle='rgba(255,90,125,.12)';x.beginPath();
   for(const p of P){x.moveTo(p.x+p.r*3.2,p.y);x.arc(p.x,p.y,p.r*3.2,0,6.283)}x.fill()}
  for(const p of P){p.x+=p.vx;p.y+=p.vy;
   if(p.x<0){p.x=0;p.vx=Math.abs(p.vx)}else if(p.x>W){p.x=W;p.vx=-Math.abs(p.vx)}
   if(p.y<0){p.y=0;p.vy=Math.abs(p.vy)}else if(p.y>H){p.y=H;p.vy=-Math.abs(p.vy)}}};
 const loop=t=>{if(!run)return;if(t-last>=STEP){last=t;draw()}requestAnimationFrame(loop)};
 size();draw();requestAnimationFrame(loop);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)run=false;else if(!run){run=true;requestAnimationFrame(loop)}});
 /* لە مۆبایل ڕێگری لە ڕیسایزی بچووک (شاردنەوەی ناونیشانی وێبگەڕ) */
 let rz,lw=innerWidth;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{
  if(mobile&&innerWidth===lw){H=innerHeight;c.height=H;x.setTransform(1,0,0,1,0,0);return}
  lw=innerWidth;size()},200)});
})();

addEventListener('scroll',()=>document.querySelector('header').classList.toggle('sc',scrollY>8),{passive:true});
