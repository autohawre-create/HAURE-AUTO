<!DOCTYPE html>
<html dir="rtl" lang="ckb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2933">
<title>HAWRE AUTO</title>
<meta name="description" content="HAWRE-AUTO">
<meta property="og:type" content="website">
<meta property="og:title" content="HAWRE AUTO">
<meta property="og:description" content="هاوردەکردنی سەیارە لە ئەمریکا، کەنەدا و ئیماراتەوە بۆ کوردستان.">
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=Noto+Kufi+Arabic:wght@500;700;800&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#12181f;--g:#1f2933;--g2:#323f4b;--mut:#616e7c;--line:#e4e7eb;--tint:#f5f7fa;--gold:#b8924a;--gold2:#e0c48b;--w:1200px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;color:var(--ink);background:#fff;line-height:1.85;font-size:1.02rem;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,.btn,.menu a{font-family:'Noto Kufi Arabic','Vazirmatn',sans-serif;letter-spacing:0}
html[lang=en] h1,html[lang=en] h2,html[lang=en] h3,html[lang=en] .btn,html[lang=en] .menu a{font-family:'Outfit','Vazirmatn',sans-serif;font-weight:600}
img,svg,video,iframe{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate}
.wrap{max-width:var(--w);margin:0 auto;padding:0 24px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border:0;border-radius:999px;background:var(--g);color:#fff;font-weight:700;cursor:pointer;transition:background .25s,color .25s}
.btn:hover{background:var(--gold);color:#fff}
/* ---------- هێدەر ---------- */
header{position:fixed;top:0;inset-inline:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);transition:background .3s,box-shadow .3s,border-color .3s}
header.sc{box-shadow:0 12px 32px -22px rgba(18,24,31,.5)}
.bar{display:flex;align-items:center;gap:28px;height:64px}
.logo{display:flex;align-items:center;gap:12px;flex:none;color:var(--ink)}
.logo-img{height:40px;width:auto;max-width:120px;object-fit:contain;border-radius:8px}
.logo-txt{font:600 1.05rem/1 'Outfit',sans-serif;letter-spacing:.16em;white-space:nowrap}
.logo-txt b{font-weight:700}
.logo-img+.logo-txt{padding-inline-start:12px;border-inline-start:1.5px solid var(--line)}
.menu{display:none;position:fixed;top:64px;inset-inline:0;bottom:0;background:#fff;flex-direction:column;padding:10px 22px 32px;overflow:auto;z-index:49}
.menu.open{display:flex}
.menu a{min-height:62px;display:flex;align-items:center;font-size:1.12rem;font-weight:700;border-bottom:1px solid var(--line)}
.menu .m-cta{justify-content:center;margin-top:26px;border:0;border-radius:999px;background:var(--g);color:#fff;min-height:54px}
.lang{display:flex;margin-inline-start:auto;background:var(--tint);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;border-radius:999px;padding:4px 11px;min-height:30px;font-size:.82rem;font-weight:700;color:var(--mut);cursor:pointer;transition:.25s}
.lang button.on{background:var(--g);color:#fff}
.tools{display:none}
.burger{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:1.3rem;color:var(--ink);cursor:pointer}
/* ---------- وێنەی گشتی ---------- */
.slot{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(135deg,#eceff3,#dfe3e8)}
.slot>img,.slot>video,.slot>iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.slot>img.hbg{filter:blur(26px) brightness(.85);transform:scale(1.15)}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;color:#9aa5b1;padding:10px}
.ph svg{width:34px;height:34px}.ph b{font-size:.78rem}.ph small{opacity:.7;font-size:.72rem}
/* ---------- هیرۆ (مۆبایل) ---------- */
.hero{position:relative;padding-top:64px;background:#fff}
.hero .slot{aspect-ratio:1920/840;height:auto}
.hero .slot>img:not(.hbg),.hero .slot>video{object-fit:contain}
.hero .txt{position:relative;z-index:3;margin-top:-26px;background:#fff;border-radius:26px 26px 0 0;padding:28px 18px;text-align:center;box-shadow:0 -18px 30px -22px rgba(18,24,31,.55)}
.eyebrow{display:none}
.hero h1{font-size:1.5rem;line-height:1.55;font-weight:800;text-wrap:balance}
.hero h1::before{content:'';display:block;width:44px;height:4px;border-radius:2px;background:var(--gold);margin:0 auto 14px}
.hero h1 em{font-style:normal;border-bottom:3px solid var(--gold)}
.hero p{margin:14px auto 0;max-width:34ch;font-size:.92rem;color:var(--mut)}
/* ---------- بەشەکان ---------- */
section{padding:56px 0}
.h2{font-size:1.4rem;font-weight:800;line-height:1.5;text-align:center;text-wrap:balance}
.h2::before{content:'';display:block;width:40px;height:4px;border-radius:2px;background:var(--gold);margin:0 auto 14px}
.sub{max-width:56ch;margin:12px auto 0;text-align:center;color:var(--mut);font-size:.92rem;line-height:1.9;text-wrap:pretty}
#countries{background:linear-gradient(160deg,var(--g2),var(--g) 55%,#ffffff);color:#fff}
#countries .sub{color:#ffffff}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:720px;margin:28px auto 0}
.cc{display:flex;flex-direction:column;align-items:center;padding:20px 4px 16px;border-radius:16px;background:rgba(243, 242, 242, 0.06);border:1px solid rgb(253, 253, 253);transition:transform .4s cubic-bezier(.2,.8,.2,1),background .4s,border-color .4s,opacity .7s}
.cc:hover{transform:translateY(-6px);background:rgba(241, 0, 0, 0.11);border-color:var(--gold)}
.cc .fl{width:48px;height:48px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 12px 22px -10px rgba(255, 255, 255, 0.6)}
.cc .fl svg{width:100%;height:100%;border-radius:50%}
.cc h3{margin-top:14px;font-size:.85rem;font-weight:700}
#process{background:var(--tint)}
.steps{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:32px}
.steps::before{content:'';position:absolute;top:20px;inset-inline:12.5%;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.step{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 2px}
.step small,.step p{display:none}
.step .n{order:-1;position:relative;z-index:1;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:var(--gold2);font:600 1.05rem/1 'Outfit',sans-serif;border:4px solid var(--tint);box-shadow:0 0 0 2px var(--gold);margin-bottom:12px}
.step h3{font-size:.72rem;font-weight:800;line-height:1.5}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:28px}
.pics .slot{aspect-ratio:3/4;height:auto;border-radius:12px}
.pics .slot>img{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.pics .slot:hover>img{transform:scale(1.05)}
.cta{padding:56px 12px;background:#fff}
.box.rq{max-width:var(--w);margin:0 auto;display:grid;grid-template-columns:1fr;overflow:hidden;border-radius:22px;border:1px solid var(--line);box-shadow:0 40px 80px -48px rgba(18,24,31,.6);background:#fff}
.rq>div{background:linear-gradient(160deg,var(--g2),var(--g) 55%,#12181f);padding:28px 18px;display:flex;flex-direction:column;justify-content:center;color:#cbd2d9}
.rq>div::before{content:'';width:44px;height:4px;border-radius:2px;background:var(--gold);margin-bottom:18px}
.rq h2{color:#fff;font-size:1.3rem;line-height:1.5;font-weight:800}
.rq p{margin-top:10px;font-size:.9rem}
.rq form{display:grid;grid-template-columns:1fr;gap:12px;padding:24px 16px}
.rq input,.rq select{width:100%;min-height:48px;padding:0 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:16px}
.rq input:focus,.rq select:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,146,74,.22)}
.rq .full{min-height:52px}
/* ---------- فووتەر ---------- */
footer{background:#12181f;color:#cbd2d9;border-top:3px solid var(--gold);padding:48px 0 24px}
footer .logo{color:#fff}
footer .logo-img+.logo-txt{border-color:rgba(255,255,255,.3)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:26px 16px}
.fg>div:first-child,.fg .fm{grid-column:1/-1}
footer h4{color:#fff;font-size:.95rem;margin-bottom:6px}
footer a,.adr{display:block;padding:4px 0;font-size:.9rem;line-height:1.9}
footer a:hover{color:var(--gold2)}
html[dir=rtl] footer a[href^="tel"],html[dir=rtl] footer a[href^="mailto"]{text-align:right}
.fmap{height:140px;border-radius:14px;overflow:hidden;background:#1c242c;border:1px solid rgba(255,255,255,.14)}
.fmap iframe{width:100%;height:100%;border:0;filter:grayscale(1) contrast(1.05);transition:filter .5s}
.fmap:hover iframe{filter:none}
#map-link{display:inline-block;margin-top:10px;color:#fff;font-weight:700;font-size:.9rem;border-bottom:1px solid rgba(184,146,74,.7)}
.fb{display:flex;flex-direction:column;align-items:flex-start;gap:16px;margin-top:36px;padding-top:22px;border-top:1px solid rgba(255,255,255,.1);font-size:.88rem}
.soc-row{display:flex;gap:14px}
.soc-a{position:relative;width:48px;height:48px;padding:0;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 0 0 1.5px rgba(255,255,255,.18),0 10px 22px -8px rgba(0,0,0,.7);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.soc-a:hover{transform:translateY(-5px) scale(1.08);color:#fff}
.soc-a:active{transform:scale(.95)}
.soc-a svg{width:24px;height:24px}
.soc-a[aria-label=instagram]{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%)}
.soc-a[aria-label=instagram]:hover{box-shadow:0 0 0 1.5px rgba(255,255,255,.5),0 14px 26px -8px rgba(214,36,159,.75)}
.soc-a[aria-label=facebook]{background:#0866FF;overflow:hidden}
.soc-a[aria-label=facebook] svg{width:100%;height:100%;border-radius:50%}
.soc-a[aria-label=facebook]:hover{box-shadow:0 0 0 1.5px rgba(255,255,255,.5),0 14px 26px -8px rgba(8,102,255,.8)}
.soc-a[aria-label=tiktok]{background:linear-gradient(145deg,#1a1a1a,#000)}
.soc-a[aria-label=tiktok] svg{width:22px;height:22px}
.soc-a[aria-label=tiktok]:hover{box-shadow:0 0 0 1.5px rgba(255,255,255,.5),-6px 8px 22px -8px rgba(37,244,238,.7),6px 8px 22px -8px rgba(254,44,85,.7)}
.wa{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));inset-inline-start:14px;z-index:60;width:46px;height:46px;border-radius:50%;background:#1faa59;color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(18,24,31,.3)}
.wa svg{width:24px;height:24px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* ---------- تابلێت و کۆمپیوتەر ---------- */
@media(min-width:761px){
 section{padding:96px 0}
 .h2{font-size:clamp(1.7rem,3vw,2.5rem)}
 .h2::before{width:48px;margin-bottom:18px}
 .sub{font-size:1.05rem}
 .cgrid{gap:18px;margin-top:52px}
 .cc{padding:40px 12px 32px;border-radius:22px}
 .cc .fl{width:84px;height:84px;box-shadow:0 0 0 4px rgba(255,255,255,.9),0 16px 28px -12px rgba(0,0,0,.6)}
 .cc h3{margin-top:26px;font-size:1.25rem}
 .steps{gap:20px;margin-top:64px}
 .steps::before{top:30px}
 .step{padding:0 10px}
 .step p{display:block;margin-top:8px;font-size:.95rem;color:var(--mut);line-height:1.9}
 .step .n{width:60px;height:60px;font-size:1.5rem;border-width:5px;margin-bottom:20px}
 .step h3{font-size:1.2rem}
 .pics{grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr;gap:18px;height:520px;margin-top:72px}
 .pics>div{height:100%}
 .pics>div:first-child{grid-row:1/3}
 .pics .slot{aspect-ratio:auto;height:100%;border-radius:22px}
 .cta{padding:96px 24px}
 .box.rq{grid-template-columns:1fr 1.25fr;border-radius:26px}
 .rq>div{padding:56px 44px}
 .rq h2{font-size:clamp(1.6rem,2.8vw,2.2rem)}
 .rq form{grid-template-columns:1fr 1fr;padding:56px 44px;align-content:center}
 .rq .full{grid-column:1/-1;min-height:56px;font-size:1rem}
 footer{padding:72px 0 28px}
 .fg{grid-template-columns:1.3fr 1fr 1fr 1.5fr;gap:40px}
 .fg>div:first-child,.fg .fm{grid-column:auto}
 .fmap{height:150px}
 .fb{flex-direction:row;justify-content:space-between;align-items:center;margin-top:48px}
 .wa{width:56px;height:56px;bottom:calc(20px + env(safe-area-inset-bottom));inset-inline-start:20px}
}
@media(min-width:981px){
 .bar{height:76px;gap:32px}
 .logo-txt{font-size:1.3rem}
 .logo-img{height:48px}
 .menu{display:flex;position:static;flex-direction:row;justify-content:center;flex:1;gap:38px;padding:0;background:none;overflow:visible}
 .menu a{position:relative;min-height:0;padding:28px 0;border:0;font-size:1rem}
 .menu a::after{content:'';position:absolute;inset-inline:0;bottom:20px;height:2px;background:var(--gold);transform:scaleX(0);transition:transform .3s}
 .menu a:hover::after{transform:scaleX(1)}
 .menu .m-cta{display:none}
 .lang{margin-inline-start:0}
 .lang button{padding:4px 14px}
 .tools{display:block}
 .tools .btn{min-height:44px;padding:0 26px;font-size:.92rem}
 .burger{display:none}
 header:not(.sc){background:transparent;border-color:transparent}
 header:not(.sc) .logo,header:not(.sc) .menu a{color:#fff}
 header:not(.sc) .logo-img+.logo-txt{border-color:rgba(255,255,255,.35)}
 header:not(.sc) .lang{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
 header:not(.sc) .lang button{color:#fff}
 header:not(.sc) .lang button.on{background:#fff;color:var(--ink)}
 header:not(.sc) .tools .btn{background:#fff;color:var(--ink)}
 header:not(.sc) .tools .btn:hover{background:var(--gold);color:#fff}
 .hero{height:100svh;min-height:640px;max-height:920px;padding:0;color:#fff;background:var(--g)}
 .hero .slot{position:absolute;inset:0;height:100%!important;aspect-ratio:auto!important}
 .hero .slot>img.hbg{display:none}
 .hero .slot>img:not(.hbg),.hero .slot>video{object-fit:cover}
 .hero::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to left,rgba(14,19,25,.88) 0%,rgba(14,19,25,.7) 30%,rgba(14,19,25,.25) 58%,rgba(14,19,25,.1) 100%),linear-gradient(to top,rgba(14,19,25,.8) 0%,rgba(14,19,25,0) 40%),linear-gradient(to bottom,rgba(14,19,25,.55) 0%,rgba(14,19,25,0) 22%)}
 html[dir=ltr] .hero::after{background:linear-gradient(to right,rgba(14,19,25,.88) 0%,rgba(14,19,25,.7) 30%,rgba(14,19,25,.25) 58%,rgba(14,19,25,.1) 100%),linear-gradient(to top,rgba(14,19,25,.8) 0%,rgba(14,19,25,0) 40%),linear-gradient(to bottom,rgba(14,19,25,.55) 0%,rgba(14,19,25,0) 22%)}
 .hero .txt{position:absolute;inset:0;margin:0;background:none;border-radius:0;box-shadow:none;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:start;padding:80px max(24px,calc((100% - var(--w))/2 + 24px)) 80px}
 .hero h1{max-width:20ch;font-size:clamp(2.3rem,4vw,3.8rem);line-height:1.4;text-shadow:0 2px 30px rgba(0,0,0,.4)}
 .hero h1::before{margin:0 0 24px;width:60px}
 .hero h1 em{color:var(--gold2);border:0}
 .hero p{margin:20px 0 0;max-width:44ch;font-size:1.18rem;line-height:2;color:rgba(255,255,255,.92);text-shadow:0 1px 18px rgba(0,0,0,.5)}
}
@media(max-width:980px){.bar{padding:0 14px;gap:8px}.burger{flex:none}.lang button{padding:4px 9px;font-size:.78rem}.logo-txt{font-size:.95rem;letter-spacing:.12em}}
@media(min-width:761px){.box.rq{max-width:calc(var(--w) - 48px)}}
.ph svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:760px){.pics .ph b,.pics .ph small{display:none}}
/* ---------- مۆبایل: ڕێکخستنی زیاتر ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:break-word}
.fg>div,.cgrid>*,.steps>*,.pics>*{min-width:0}
.hero .txt{overflow-wrap:anywhere}
@media(max-width:760px){
 .wrap{padding:0 18px}
 .hero h1{font-size:1.4rem}
 .hero p{font-size:.9rem}
 .btn{padding:0 22px}
 .rq .full{width:100%}
}
@media(max-width:420px){
 body{font-size:.98rem}
 .wrap{padding:0 16px}
 .bar{height:60px;padding:0 12px;gap:6px}
 .menu{top:60px}
 html{scroll-padding-top:70px}
 .hero{padding-top:60px}
 .logo-img{height:34px;max-width:90px}
 .logo-txt{font-size:.82rem;letter-spacing:.08em}
 .lang button{padding:4px 7px;font-size:.72rem;min-height:28px}
 .burger{width:40px;height:40px;font-size:1.15rem}
 .hero .txt{padding:24px 16px}
 .hero h1{font-size:1.25rem}
 section{padding:44px 0}
 .h2{font-size:1.25rem}
 .cc{padding:16px 2px 12px}
 .cc .fl{width:42px;height:42px}
 .cc h3{font-size:.78rem}
 .step h3{font-size:.66rem}
 .step .n{width:34px;height:34px;font-size:.95rem}
 .steps::before{top:17px}
 .cta{padding:44px 10px}
 .rq>div{padding:24px 16px}
 .rq h2{font-size:1.15rem}
 footer{padding:40px 0 20px}
 footer a,.adr{font-size:.86rem}
}
@media(max-width:340px){.logo-txt{display:none}.cgrid{gap:6px}}
</style>
</head>
<body>

<!-- بارێکی بچووکی سەرەوە (پەیوەندی) -->

<!-- هێدەر -->
<header><div class="wrap bar">
  <a class="logo" href="#top" id="site-logo"><span class="ltr">HAWRE AUTO</span></a>
  <nav class="menu" id="menu">
    <a href="#countries" data-i="nav_cars"></a>
    <a href="#process" data-i="nav_process"></a>
    
    <a href="#contact" data-i="nav_contact"></a>
    <a class="m-cta" href="#request" data-i="nav_cta"></a>
  </nav>
  <div class="lang" id="lang">
    <button data-l="ckb">کوردی</button>
    <button data-l="ar">عربي</button>
    <button data-l="en">EN</button>
  </div>
  <div class="tools"><a class="btn" href="#request" data-i="nav_cta"></a></div>
  <button class="burger" id="burger" aria-label="menu">☰</button>
</div></header>

<main id="top">

<!-- وێنەی سەرەکی + نووسین لە ژێریدا -->
<div class="hero">
  <div id="hero-media"></div>
  <div class="txt">
    <span class="eyebrow" data-i="util_tag"></span>
    <h1><span data-i="h1a"></span> <em data-i="h1b"></em></h1>
    <p data-i="hero_p"></p>
  </div>
</div>



<!-- وڵاتەکانی هێنان -->
<section id="countries"><div class="wrap">
  <h2 class="h2" data-i="cn_h"></h2>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lang='ckb';

if(!I18N[lang])lang='ckb';

const ICON={
  img:'<svg viewBox="0 0 48 48"><rect x="6" y="9" width="36" height="30" rx="3"/><circle cx="17" cy="20" r="3.5"/><path d="m6 34 11-10 8 7 6-5 11 9"/></svg>',
  vid:'<svg viewBox="0 0 48 48"><rect x="6" y="9" width="36" height="30" rx="3"/><path d="m20 18 11 6-11 6z"/></svg>'
};
const ytId=u=>{const m=String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);return m?m[1]:null};
const player=(src,poster,bg)=>{
  const id=ytId(src);
  if(id)return `<iframe src="https://www.youtube.com/embed/${id}${bg?`?autoplay=1&mute=1&loop=1&controls=0&playlist=${id}`:''}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy" title="video"></iframe>`;
  const p=poster?` poster="${esc(poster)}"`:'';
  return bg?`<video src="${esc(src)}"${p} autoplay muted loop playsinline onerror="this.remove()"></video>`
           :`<video src="${esc(src)}"${p} controls playsinline preload="metadata" onerror="this.remove()"></video>`;
};
/* m={image,video,poster} · key=ناوی ئەم شوێنە لە MEDIA · size=قەبارەی باش */
const slot=(m,key,size,o={})=>{
  m=m||{};let top='';
  if(m.video)top=player(m.video,m.poster||m.image,o.bg);
  else if(m.image)top=`<img src="${esc(m.image)}" alt="HAWRE AUTO" decoding="async" ${o.eager?'fetchpriority="high"':'loading="lazy"'} onerror="this.remove()">`;
  return `<div class="slot"><div class="ph">${ICON[o.kind||'img']}<b>${esc(key)}</b>${size?`<small>${size}</small>`:''}</div>${top}</div>`;
};
const logoHtml=()=>(MEDIA.logo?`<img src="${esc(MEDIA.logo)}" alt="" class="logo-img" onerror="this.remove()">`:'')+'<span class="logo-txt ltr"><b>HAWRE</b> AUTO</span>';

  const s=document.querySelector('.hero .slot'),i=s.querySelector('img');

})();

function setLang(l){
  lang=l;try{localStorage.setItem('hawre-lang',l)}catch(e){}
  const h=document.documentElement;h.lang=l;h.dir=l==='en'?'ltr':'rtl';
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
}
